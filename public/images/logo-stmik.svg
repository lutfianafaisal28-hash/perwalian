<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 220" width="400" height="220">
  <defs>
    <linearGradient id="navyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a237e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#283593;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f9a825;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#fbc02d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f57f17;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0d47a1;stop-opacity:1" />
      <stop offset="40%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#42a5f5;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Gold swoosh -->
  <ellipse cx="195" cy="115" rx="180" ry="95" fill="none" stroke="url(#goldGrad)" stroke-width="14" stroke-dasharray="420 140" transform="rotate(-10 195 115)"/>
  <ellipse cx="195" cy="115" rx="180" ry="95" fill="none" stroke="#e6a817" stroke-width="10" stroke-dasharray="380 180" transform="rotate(-10 195 115)" opacity="0.6"/>

  <!-- N wave shape -->
  <path d="M 100 140 C 100 80, 130 60, 160 80 C 180 95, 170 130, 200 110 C 230 90, 260 60, 280 80 C 300 100, 280 140, 260 130" 
        fill="none" stroke="url(#waveGrad)" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100 140 C 100 80, 130 60, 160 80 C 180 95, 170 130, 200 110 C 230 90, 260 60, 280 80 C 300 100, 280 140, 260 130" 
        fill="none" stroke="#b3e5fc" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>

  <!-- White circle -->
  <circle cx="310" cy="65" r="42" fill="white" opacity="0.95"/>

  <!-- Orange dot -->
  <circle cx="320" cy="58" r="14" fill="#e65100"/>
  <circle cx="323" cy="54" r="4" fill="#ff8a65" opacity="0.6"/>

  <!-- Small blue squares -->
  <rect x="200" y="38" width="10" height="10" fill="#5c6bc0" transform="rotate(15 205 43)" opacity="0.7"/>
  <rect x="218" y="30" width="8" height="8" fill="#7986cb" transform="rotate(-10 222 34)" opacity="0.6"/>
  <rect x="232" y="40" width="7" height="7" fill="#9fa8da" transform="rotate(20 235 43)" opacity="0.5"/>

  <!-- Text STMIK BANDUNG 1993 -->
  <text x="200" y="195" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" fill="#1a237e" stroke="white" stroke-width="3" paint-order="stroke" letter-spacing="1">STMIK BANDUNG 1993</text>
</svg>
