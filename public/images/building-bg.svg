<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <!-- Sky -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="55%" stop-color="#B8DCF0"/>
      <stop offset="100%" stop-color="#E0ECF5"/>
    </linearGradient>
    <!-- Building blue facade -->
    <linearGradient id="facadeBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C4A9E"/>
      <stop offset="50%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#1A3278"/>
    </linearGradient>
    <linearGradient id="facadeBlueDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#253F8A"/>
      <stop offset="100%" stop-color="#162B6B"/>
    </linearGradient>
    <!-- Orange accent -->
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F5A623"/>
      <stop offset="50%" stop-color="#F9B844"/>
      <stop offset="100%" stop-color="#F5A623"/>
    </linearGradient>
    <!-- Window glass -->
    <linearGradient id="glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D6EAF8"/>
      <stop offset="30%" stop-color="#AED6F1"/>
      <stop offset="70%" stop-color="#85C1E9"/>
      <stop offset="100%" stop-color="#5DADE2"/>
    </linearGradient>
    <linearGradient id="glassDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7FB3D8"/>
      <stop offset="100%" stop-color="#5499C7"/>
    </linearGradient>
    <!-- Reflection highlight -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%" stop-color="rgba(255,255,255,0.1)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- Ground -->
    <linearGradient id="ground" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5D6D7E"/>
      <stop offset="100%" stop-color="#4A5568"/>
    </linearGradient>
    <!-- Tree green -->
    <radialGradient id="tree1" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </radialGradient>
    <radialGradient id="tree2" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#66BB6A"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </radialGradient>
    <!-- Entrance canopy -->
    <linearGradient id="canopy" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#546E7A"/>
      <stop offset="100%" stop-color="#37474F"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="120%">
      <feDropShadow dx="3" dy="5" stdDeviation="4" flood-color="#1a2332" flood-opacity="0.25"/>
    </filter>
    <filter id="softShadow" x="-10%" y="-10%" width="125%" height="130%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-color="#1a2332" flood-opacity="0.15"/>
    </filter>
    <!-- Cloud -->
    <radialGradient id="cloud" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.6"/>
    </radialGradient>
  </defs>

  <!-- ===== SKY ===== -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- Clouds -->
  <g opacity="0.8">
    <ellipse cx="180" cy="90" rx="70" ry="30" fill="url(#cloud)"/>
    <ellipse cx="230" cy="80" rx="50" ry="25" fill="url(#cloud)"/>
    <ellipse cx="140" cy="85" rx="45" ry="22" fill="url(#cloud)"/>

    <ellipse cx="650" cy="60" rx="80" ry="28" fill="url(#cloud)"/>
    <ellipse cx="710" cy="50" rx="55" ry="22" fill="url(#cloud)"/>
    <ellipse cx="600" cy="55" rx="48" ry="20" fill="url(#cloud)"/>

    <ellipse cx="1000" cy="100" rx="65" ry="25" fill="url(#cloud)"/>
    <ellipse cx="1050" cy="92" rx="45" ry="20" fill="url(#cloud)"/>
  </g>

  <!-- ===== MAIN BUILDING ===== -->
  <g filter="url(#shadow)">
    <!-- Left wing (taller) -->
    <rect x="180" y="100" width="360" height="500" rx="3" fill="url(#facadeBlue)"/>
    <!-- Right wing (shorter) -->
    <rect x="560" y="160" width="320" height="440" rx="3" fill="url(#facadeBlueDark)"/>

    <!-- Connecting bridge section -->
    <rect x="530" y="200" width="40" height="120" fill="url(#facadeBlue)"/>
  </g>

  <!-- ===== ORANGE HORIZONTAL ACCENTS ===== -->
  <!-- Left wing accents -->
  <rect x="175" y="96" width="370" height="10" rx="2" fill="url(#orange)"/>
  <rect x="175" y="215" width="370" height="8" fill="url(#orange)"/>
  <rect x="175" y="340" width="370" height="8" fill="url(#orange)"/>
  <rect x="175" y="465" width="370" height="8" fill="url(#orange)"/>

  <!-- Right wing accents -->
  <rect x="555" y="156" width="330" height="10" rx="2" fill="url(#orange)"/>
  <rect x="555" y="280" width="330" height="8" fill="url(#orange)"/>
  <rect x="555" y="400" width="330" height="8" fill="url(#orange)"/>

  <!-- ===== LEFT WING WINDOWS ===== -->
  <!-- Floor 1 (top) -->
  <g>
    <rect x="205" y="118" width="52" height="86" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="205" y="118" width="26" height="86" fill="url(#glassReflect)"/>
    <rect x="272" y="118" width="52" height="86" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="272" y="118" width="26" height="86" fill="url(#glassReflect)"/>
    <rect x="339" y="118" width="52" height="86" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="339" y="118" width="26" height="86" fill="url(#glassReflect)"/>
    <rect x="406" y="118" width="52" height="86" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="406" y="118" width="26" height="86" fill="url(#glassReflect)"/>
    <rect x="473" y="118" width="47" height="86" rx="2" fill="url(#glassDark)" stroke="#90A4AE" stroke-width="1"/>
  </g>

  <!-- Floor 2 -->
  <g>
    <rect x="205" y="232" width="52" height="100" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="205" y="232" width="26" height="100" fill="url(#glassReflect)"/>
    <rect x="272" y="232" width="52" height="100" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="272" y="232" width="26" height="100" fill="url(#glassReflect)"/>
    <rect x="339" y="232" width="52" height="100" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="339" y="232" width="26" height="100" fill="url(#glassReflect)"/>
    <rect x="406" y="232" width="52" height="100" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="406" y="232" width="26" height="100" fill="url(#glassReflect)"/>
    <rect x="473" y="232" width="47" height="100" rx="2" fill="url(#glassDark)" stroke="#90A4AE" stroke-width="1"/>
  </g>

  <!-- Floor 3 -->
  <g>
    <rect x="205" y="358" width="52" height="98" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="205" y="358" width="26" height="98" fill="url(#glassReflect)"/>
    <rect x="272" y="358" width="52" height="98" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="272" y="358" width="26" height="98" fill="url(#glassReflect)"/>
    <rect x="339" y="358" width="52" height="98" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="339" y="358" width="26" height="98" fill="url(#glassReflect)"/>
    <rect x="406" y="358" width="52" height="98" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="406" y="358" width="26" height="98" fill="url(#glassReflect)"/>
    <rect x="473" y="358" width="47" height="98" rx="2" fill="url(#glassDark)" stroke="#90A4AE" stroke-width="1"/>
  </g>

  <!-- Floor 4 (ground level) -->
  <g>
    <rect x="205" y="482" width="52" height="78" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="205" y="482" width="26" height="78" fill="url(#glassReflect)"/>
    <rect x="272" y="482" width="52" height="78" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="272" y="482" width="26" height="78" fill="url(#glassReflect)"/>
    <rect x="339" y="482" width="52" height="78" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="339" y="482" width="26" height="78" fill="url(#glassReflect)"/>
    <rect x="406" y="482" width="52" height="78" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="406" y="482" width="26" height="78" fill="url(#glassReflect)"/>
    <rect x="473" y="482" width="47" height="78" rx="2" fill="url(#glassDark)" stroke="#90A4AE" stroke-width="1"/>
  </g>

  <!-- ===== RIGHT WING WINDOWS ===== -->
  <!-- Floor 1 -->
  <g>
    <rect x="585" y="178" width="48" height="90" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="585" y="178" width="24" height="90" fill="url(#glassReflect)"/>
    <rect x="649" y="178" width="48" height="90" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="649" y="178" width="24" height="90" fill="url(#glassReflect)"/>
    <rect x="713" y="178" width="48" height="90" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="713" y="178" width="24" height="90" fill="url(#glassReflect)"/>
    <rect x="777" y="178" width="48" height="90" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="777" y="178" width="24" height="90" fill="url(#glassReflect)"/>
    <rect x="841" y="178" width="30" height="90" rx="2" fill="url(#glassDark)" stroke="#90A4AE" stroke-width="1"/>
  </g>

  <!-- Floor 2 -->
  <g>
    <rect x="585" y="298" width="48" height="90" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="585" y="298" width="24" height="90" fill="url(#glassReflect)"/>
    <rect x="649" y="298" width="48" height="90" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="649" y="298" width="24" height="90" fill="url(#glassReflect)"/>
    <rect x="713" y="298" width="48" height="90" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="713" y="298" width="24" height="90" fill="url(#glassReflect)"/>
    <rect x="777" y="298" width="48" height="90" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="777" y="298" width="24" height="90" fill="url(#glassReflect)"/>
    <rect x="841" y="298" width="30" height="90" rx="2" fill="url(#glassDark)" stroke="#90A4AE" stroke-width="1"/>
  </g>

  <!-- Floor 3 -->
  <g>
    <rect x="585" y="418" width="48" height="82" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="585" y="418" width="24" height="82" fill="url(#glassReflect)"/>
    <rect x="649" y="418" width="48" height="82" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="649" y="418" width="24" height="82" fill="url(#glassReflect)"/>
    <rect x="713" y="418" width="48" height="82" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="713" y="418" width="24" height="82" fill="url(#glassReflect)"/>
    <rect x="777" y="418" width="48" height="82" rx="2" fill="url(#glass)" stroke="#90A4AE" stroke-width="1"/>
    <rect x="777" y="418" width="24" height="82" fill="url(#glassReflect)"/>
    <rect x="841" y="418" width="30" height="82" rx="2" fill="url(#glassDark)" stroke="#90A4AE" stroke-width="1"/>
  </g>

  <!-- ===== GROUND FLOOR / ENTRANCE ===== -->
  <rect x="175" y="600" width="720" height="60" rx="2" fill="#37474F"/>
  <rect x="175" y="596" width="720" height="8" rx="2" fill="url(#orange)"/>

  <!-- Entrance canopy -->
  <rect x="400" y="570" width="260" height="28" rx="3" fill="url(#canopy)" filter="url(#softShadow)"/>
  <rect x="395" y="566" width="270" height="8" rx="2" fill="url(#orange)"/>

  <!-- Glass entrance doors -->
  <rect x="470" y="605" width="42" height="50" rx="2" fill="url(#glass)" stroke="#78909C" stroke-width="1.5"/>
  <rect x="470" y="605" width="21" height="50" fill="url(#glassReflect)"/>
  <rect x="522" y="605" width="42" height="50" rx="2" fill="url(#glass)" stroke="#78909C" stroke-width="1.5"/>
  <rect x="522" y="605" width="21" height="50" fill="url(#glassReflect)"/>
  <!-- Door handles -->
  <rect x="508" y="622" width="3" height="16" rx="1" fill="#B0BEC5"/>
  <rect x="522" y="622" width="3" height="16" rx="1" fill="#B0BEC5"/>

  <!-- ===== STMIK BANDUNG SIGNAGE ===== -->
  <rect x="340" y="618" width="330" height="32" rx="4" fill="#1A237E" opacity="0.85"/>
  <text x="505" y="640" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="17" fill="#F9A825" letter-spacing="5">STMIK BANDUNG</text>

  <!-- ===== FLAG ===== -->
  <line x1="780" y1="566" x2="780" y2="420" stroke="#90A4AE" stroke-width="2.5"/>
  <circle cx="780" cy="418" r="4" fill="#F9A825"/>
  <rect x="782" y="422" width="28" height="14" rx="1" fill="#E53935"/>
  <rect x="782" y="436" width="28" height="14" rx="1" fill="#FFFFFF"/>

  <!-- ===== TREES & LANDSCAPING ===== -->
  <!-- Left tree 1 -->
  <rect x="100" y="560" width="10" height="60" rx="3" fill="#6D4C41"/>
  <ellipse cx="105" cy="530" rx="40" ry="38" fill="url(#tree1)"/>
  <ellipse cx="90" cy="540" rx="28" ry="25" fill="url(#tree2)" opacity="0.8"/>
  <ellipse cx="120" cy="538" rx="30" ry="28" fill="#43A047" opacity="0.7"/>

  <!-- Left tree 2 -->
  <rect x="30" y="575" width="8" height="45" rx="3" fill="#5D4037"/>
  <ellipse cx="34" cy="555" rx="32" ry="30" fill="url(#tree2)"/>
  <ellipse cx="22" cy="560" rx="22" ry="20" fill="#388E3C" opacity="0.7"/>

  <!-- Right tree 1 -->
  <rect x="950" y="555" width="10" height="65" rx="3" fill="#6D4C41"/>
  <ellipse cx="955" cy="525" rx="42" ry="40" fill="url(#tree1)"/>
  <ellipse cx="940" cy="535" rx="30" ry="27" fill="url(#tree2)" opacity="0.8"/>
  <ellipse cx="970" cy="532" rx="32" ry="30" fill="#43A047" opacity="0.7"/>

  <!-- Right tree 2 -->
  <rect x="1050" y="570" width="8" height="50" rx="3" fill="#5D4037"/>
  <ellipse cx="1054" cy="548" rx="35" ry="32" fill="url(#tree2)"/>
  <ellipse cx="1040" cy="555" rx="24" ry="22" fill="#2E7D32" opacity="0.7"/>

  <!-- Small shrubs near entrance -->
  <ellipse cx="380" cy="595" rx="18" ry="12" fill="#66BB6A"/>
  <ellipse cx="640" cy="595" rx="18" ry="12" fill="#66BB6A"/>
  <ellipse cx="360" cy="598" rx="12" ry="8" fill="#4CAF50" opacity="0.7"/>
  <ellipse cx="660" cy="598" rx="12" ry="8" fill="#4CAF50" opacity="0.7"/>

  <!-- ===== GROUND / SIDEWALK ===== -->
  <rect x="0" y="660" width="1200" height="140" fill="url(#ground)"/>
  <!-- Sidewalk line -->
  <rect x="0" y="660" width="1200" height="4" fill="#78909C"/>
  <!-- Pavement pattern -->
  <g opacity="0.15">
    <line x1="0" y1="700" x2="1200" y2="700" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="740" x2="1200" y2="740" stroke="#fff" stroke-width="1"/>
    <line x1="100" y1="660" x2="100" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="200" y1="660" x2="200" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="300" y1="660" x2="300" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="400" y1="660" x2="400" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="500" y1="660" x2="500" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="600" y1="660" x2="600" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="700" y1="660" x2="700" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="800" y1="660" x2="800" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="900" y1="660" x2="900" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="1000" y1="660" x2="1000" y2="800" stroke="#fff" stroke-width="1"/>
    <line x1="1100" y1="660" x2="1100" y2="800" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Road markings at bottom -->
  <rect x="0" y="760" width="1200" height="3" fill="#FDD835" opacity="0.5"/>
</svg>